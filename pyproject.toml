[project]
name = "learning-ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Denis Kusmahendra", email = "deniskusmahendra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=0.3.0",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.2",
    "ipykernel>=7.4.0",
    "streamlit>=1.66.1",
    "notebook>=7.6.3",
    "jupyterthemes>=0.20.0",
    "google-genai>=2.31.0",
    "dotenv>=0.9.9",
    "cerebras-cloud-sdk>=1.91.0",
    "groq>=0.37.1",
    "fastapi[standard]>=0.162.0",
    "requests>=2.34.2",
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "pypdf>=6.21.4",
    "langchain-huggingface>=1.2.3",
    "langchain-chroma>=1.1.0",
    "torch>=2.15.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
learning-ai-engineering = "learning_ai_engineering:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
